<script>
/**
 * admin-scripts.html - Lógica do painel de administração da Ação entre Amigos
 */

// O navegador pode bloquear armazenamento dentro do iframe do Apps Script.
// Nesse caso, o login continua funcionando durante a visita atual.
function lerTokenAdmin() {
  try { return sessionStorage.getItem('cm_admin_token') || ''; }
  catch (err) { return ''; }
}

function salvarTokenAdmin(token) {
  try {
    if (token) sessionStorage.setItem('cm_admin_token', token);
    else sessionStorage.removeItem('cm_admin_token');
  } catch (err) {}
}

var adminToken = lerTokenAdmin();
var rejeicaoAlvo = null;

document.addEventListener('DOMContentLoaded', function() {
  if (adminToken) {
    carregarDashboard();
  }
});

function autenticarAdmin(e, contaGoogle) {
  if (e) e.preventDefault();
  var input = document.getElementById('admin-pin-input');
  var pin = contaGoogle ? '' : input.value;
  if (!pin && !contaGoogle) { showToast('Informe sua senha administrativa.', 'warning'); return; }
  if (!isAppsScript()) { showToast('Abra o painel pelo link publicado do Apps Script.', 'error'); return; }
  var btn = document.getElementById('btn-login-submit');
  btn.disabled = true;
  btn.textContent = 'Autenticando...';
  google.script.run.withSuccessHandler(function(res) {
    btn.disabled = false;
    btn.textContent = 'ACESSAR PAINEL';
    input.value = '';
    if (!res || !res.success) { showToast(res ? res.message : 'Falha no login.', 'error'); return; }
    adminToken = res.token;
    salvarTokenAdmin(adminToken);
    carregarDashboard();
  }).withFailureHandler(function() {
    btn.disabled = false;
    btn.textContent = 'ACESSAR PAINEL';
    input.value = '';
    showToast('Não foi possível entrar. Tente novamente.', 'error');
  }).loginAdmin(pin);
}

function fazerLogout() {
  if (isAppsScript() && adminToken) google.script.run.withFailureHandler(function() {}).logoutAdmin(adminToken);
  salvarTokenAdmin('');
  adminToken = '';
  document.getElementById('secao-login').style.display = 'block';
  document.getElementById('secao-dashboard').style.display = 'none';
  document.getElementById('btn-logout').style.display = 'none';
  document.getElementById('admin-pin-input').value = '';
}

function carregarDashboard(callback) {
  if (isAppsScript()) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          exibirDashboard(res);
          if (callback) callback(true);
        } else if (res && res.unauthorized) {
          fazerLogout();
          showToast(res.message, 'error');
          document.getElementById('secao-login').style.display = 'block';
          document.getElementById('secao-dashboard').style.display = 'none';
          document.getElementById('btn-logout').style.display = 'none';
          if (callback) callback(false);
        } else {
          showToast('Erro: ' + (res ? res.message : 'Falha desconhecida'), 'error');
          if (callback) callback(false);
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro no servidor: ' + err.message, 'error');
        if (callback) callback(false);
      })
      .getAdminDashboard(adminToken);
  } else {
    // Simulação local
    setTimeout(function() {
      exibirDashboard(getMockAdminDashboard());
      if (callback) callback(true);
    }, 400);
  }
}

function exibirDashboard(data) {
  try {
    document.getElementById('secao-login').style.display = 'none';
    document.getElementById('secao-dashboard').style.display = 'block';
    document.getElementById('btn-logout').style.display = 'inline-flex';

    if (!data) return;

    // 1. Atualiza métricas
    var sf = data.statsFormatado || {};
    var st = data.stats || {};
    var elTotal = document.getElementById('dash-total'); if (elTotal) elTotal.textContent = sf.total || 500;
    var elDisp = document.getElementById('dash-disp'); if (elDisp) elDisp.textContent = sf.disponiveis || 0;
    var elRes = document.getElementById('dash-res'); if (elRes) elRes.textContent = sf.reservados || 0;
    var elVal = document.getElementById('dash-val'); if (elVal) elVal.textContent = sf.aguardando || 0;
    var elConf = document.getElementById('dash-conf'); if (elConf) elConf.textContent = sf.confirmados || 0;

    var elValConf = document.getElementById('dash-valor-confirmado'); if (elValConf) elValConf.textContent = sf.valorConfirmado || 'R$ 0,00';
    var elValPend = document.getElementById('dash-valor-pendente'); if (elValPend) elValPend.textContent = sf.valorAguardando || 'R$ 0,00';

    var totalN = Number(st.total || 500);
    var perc = totalN > 0 ? Math.round(((st.confirmados || 0) / totalN) * 100) : 0;
    var elTaxa = document.getElementById('taxa-conversao');
    if (elTaxa) elTaxa.textContent = perc + '%';

    // 2. Renderiza tabela de pagamentos pendentes
    renderizarTabelaPendentes(data.pendentes || []);

    // 3. Preenche formulário de configurações
    preencherFormConfigs(data.configuracoes);

    // 4. Renderiza logs
    renderizarLogs(data.logs || []);
  } catch (err) {
    console.error('Erro ao renderizar dashboard:', err);
    showToast('Aviso na interface: ' + err.message, 'warning');
  }
}

function adicionarCelula(row, text) {
  var cell = document.createElement('td');
  cell.textContent = text == null ? '' : String(text);
  row.appendChild(cell);
  return cell;
}

function linkSeguro(cell, url, label, host) {
  try {
    var parsed = new URL(url);
    if (parsed.protocol !== 'https:' || parsed.hostname !== host || parsed.username || parsed.password) throw new Error('URL inválida');
    var link = document.createElement('a');
    link.href = parsed.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = label;
    cell.appendChild(link);
  } catch (err) { cell.textContent = 'Link indisponível'; }
}

function renderizarTabelaPendentes(lista) {
  var tbody = document.getElementById('tbody-pendentes');
  document.getElementById('badge-pendentes-count').textContent = lista.length;
  tbody.textContent = '';
  if (!lista.length) {
    var empty = document.createElement('tr');
    adicionarCelula(empty, 'Nenhum pagamento aguardando validação.').colSpan = 8;
    tbody.appendChild(empty);
  }
  lista.forEach(function(item) {
    var row = document.createElement('tr');
    var numeros = (item.numeros || []).join(', ');
    adicionarCelula(row, item.reservaId);
    adicionarCelula(row, item.nome);
    var phone = String(item.whatsappLimpo || '').replace(/\D/g, '');
    linkSeguro(adicionarCelula(row, ''), 'https://wa.me/' + (phone.indexOf('55') === 0 ? phone : '55' + phone), item.whatsapp, 'wa.me');
    adicionarCelula(row, numeros + ' (' + item.quantidade + ' pts)');
    adicionarCelula(row, item.valorFormatado);
    adicionarCelula(row, item.dataEnvioFormatada);
    linkSeguro(adicionarCelula(row, ''), item.comprovanteUrl, 'Ver comprovante', 'drive.google.com');
    var actions = adicionarCelula(row, '');
    [['✓ Aprovar', 'approve', iniciarAprovacao], ['✕ Rejeitar', 'reject', abrirModalRejeicao]].forEach(function(action) {
      var button = document.createElement('button');
      button.type = 'button'; button.className = 'btn-action ' + action[1]; button.textContent = action[0];
      button.addEventListener('click', function() { action[2](item.pagamentoId, item.reservaId, numeros); });
      actions.appendChild(button);
    });
    tbody.appendChild(row);
  });
}

function iniciarAprovacao(pagamentoId, reservaId, numerosTexto) {
  var confirma = confirm('Deseja realmente confirmar o pagamento e os números ' + numerosTexto + '?');
  if (!confirma) return;

  if (isAppsScript()) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          showToast(res.message, 'success');
          carregarDashboard();
        } else {
          showToast(res ? res.message : 'Erro ao aprovar.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Erro no servidor: ' + err.message, 'error');
      })
      .aprovarPagamento(adminToken, pagamentoId, reservaId);
  } else {
    showToast('Pagamento aprovado com sucesso! (Modo local)', 'success');
    carregarDashboard();
  }
}

function abrirModalRejeicao(pagamentoId, reservaId, numerosTexto) {
  rejeicaoAlvo = { pagamentoId: pagamentoId, reservaId: reservaId };
  document.getElementById('rej-protocolo-display').textContent = reservaId;
  document.getElementById('rej-numeros-display').textContent = numerosTexto;
  abrirModal('modal-rejeitar');
}

function confirmarRejeicao(e) {
  e.preventDefault();
  if (!rejeicaoAlvo) return;

  var motivo = document.getElementById('rej-motivo').value;
  var acao = document.querySelector('input[name="rej-acao"]:checked').value;
  var btn = document.getElementById('btn-confirmar-rej');

  btn.disabled = true;
  btn.textContent = 'Processando...';

  if (isAppsScript()) {
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = 'CONFIRMAR REJEIÇÃO';
        fecharModal('modal-rejeitar');

        if (res && res.success) {
          showToast(res.message, 'success');
          carregarDashboard();
        } else {
          showToast(res ? res.message : 'Falha ao rejeitar.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'CONFIRMAR REJEIÇÃO';
        showToast('Erro no servidor: ' + err.message, 'error');
      })
      .rejeitarPagamento(adminToken, rejeicaoAlvo.pagamentoId, rejeicaoAlvo.reservaId, motivo, acao);
  } else {
    btn.disabled = false;
    btn.textContent = 'CONFIRMAR REJEIÇÃO';
    fecharModal('modal-rejeitar');
    showToast('Pagamento rejeitado e números atualizados! (Modo local)', 'success');
    carregarDashboard();
  }
}

function preencherFormConfigs(cfg) {
  if (!cfg) return;
  document.getElementById('cfg-chave-pix').value = cfg.chavePix || '';
  document.getElementById('cfg-favorecido').value = cfg.nomeFavorecido || '';
  document.getElementById('cfg-cidade').value = cfg.cidadePix || '';
  document.getElementById('cfg-whatsapp').value = cfg.whatsappContato || '';
  document.getElementById('cfg-valor-unit').value = cfg.valorNumero || 20;
  document.getElementById('cfg-tempo-reserva').value = cfg.tempoReservaMinutos || 15;
}

function salvarConfiguracoes(e) {
  e.preventDefault();
  var payload = {
    chavePix: document.getElementById('cfg-chave-pix').value.trim(),
    nomeFavorecido: document.getElementById('cfg-favorecido').value.trim(),
    cidadePix: document.getElementById('cfg-cidade').value.trim(),
    whatsappContato: document.getElementById('cfg-whatsapp').value.trim(),
    valorNumero: document.getElementById('cfg-valor-unit').value,
    tempoReservaMinutos: document.getElementById('cfg-tempo-reserva').value,
    adminPin: document.getElementById('cfg-admin-pin').value
  };

  var btn = document.getElementById('btn-salvar-cfg');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  if (isAppsScript()) {
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = 'SALVAR ALTERAÇÕES';
        if (res && res.success) {
          showToast(res.message, 'success');
          if (payload.adminPin) {
            fazerLogout();
            document.getElementById('cfg-admin-pin').value = '';
            return;
          }
          carregarDashboard();
        } else {
          showToast(res ? res.message : 'Falha ao salvar.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'SALVAR ALTERAÇÕES';
        showToast('Erro no servidor: ' + err.message, 'error');
      })
      .salvarConfiguracoesAdmin(adminToken, payload);
  } else {
    btn.disabled = false;
    btn.textContent = 'SALVAR ALTERAÇÕES';
    showToast('Configurações salvas! (Modo local)', 'success');
  }
}

function renderizarLogs(logs) {
  var tbody = document.getElementById('tbody-logs');
  tbody.textContent = '';
  logs.forEach(function(item) {
    var row = document.createElement('tr');
    [item.dataHora, item.acao, item.usuario, typeof item.detalhes === 'object' ? JSON.stringify(item.detalhes) : item.detalhes].forEach(function(value) { adicionarCelula(row, value); });
    tbody.appendChild(row);
  });
}

function executarLimpezaExpirados() {
  if (isAppsScript()) {
    google.script.run
      .withSuccessHandler(function(res) {
        showToast(res.message, 'success');
        carregarDashboard();
      })
      .executarLimpezaManual(adminToken);
  } else {
    showToast('Limpeza de reservas expiradas executada com sucesso!', 'success');
  }
}

function trocarTab(tabId) {
  document.querySelectorAll('.admin-tab-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  document.querySelectorAll('.admin-tab-content').forEach(function(content) {
    content.style.display = 'none';
  });

  var alvo = document.getElementById(tabId);
  if (alvo) alvo.style.display = 'block';

  // Marca botão ativo
  var botoes = document.querySelectorAll('.admin-tab-btn');
  botoes.forEach(function(b) {
    if (b.getAttribute('onclick') && b.getAttribute('onclick').indexOf(tabId) !== -1) {
      b.classList.add('active');
    }
  });
}

/**
 * Funções utilitárias do Admin
 */
function abrirModal(id) {
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function fecharModal(id) {
  var el = document.getElementById(id);
  if (el) el.classList.remove('active');
}

function showToast(msg, type) {
  var container = document.getElementById('toast-container');
  if (!container) return;

  var toast = document.createElement('div');
  toast.className = 'toast ' + (type || 'info');
  var icon = type === 'success' ? '✓' : (type === 'error' ? '✕' : 'ℹ');
  toast.textContent = icon + ' ' + msg;

  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 4500);
}

function isAppsScript() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

</script>
